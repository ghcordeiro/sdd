name: Publish existing tag

# Manual recovery: publish an already-tagged version to npm when the
# semantic-release run created the tag but failed at `npm publish`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. v1.3.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: node packages/cli/build.mjs

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}

      - name: Create GitHub release
        run: gh release create "${{ inputs.tag }}" --verify-tag --title "${{ inputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
